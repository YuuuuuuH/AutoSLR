  <text x="1044" y="1013" class="small">Escalate unresolved cases</text>

  <rect x="96" y="1054" width="440" height="116" rx="11" class="agent"/>
  <text x="116" y="1089" class="role">Research Agents</text>
  <text x="116" y="1121" class="small">Extraction · appraisal · comparison</text>
  <text x="116" y="1149" class="small">Instances scoped to research questions</text>

  <rect x="560" y="1054" width="440" height="116" rx="11" class="agent"/>
  <text x="580" y="1089" class="role">Verification Agents</text>
  <text x="580" y="1121" class="small">Claims · numbers · source support</text>
  <text x="580" y="1149" class="small">Publish challenges &amp; revision tasks</text>

  <rect x="1024" y="1054" width="464" height="116" rx="11" class="agent"/>
  <text x="1044" y="1089" class="role">Reporting Agents</text>
  <text x="1044" y="1121" class="small">Findings · report sections · figures</text>
  <text x="1044" y="1149" class="small">Request evidence for unsupported claims</text>

  <text x="96" y="1214" class="small">Agents can propose new tasks; accepted results update the shared review.</text>
  <path d="M1526 1008 H1722" class="state"/>
  <text x="1624" y="986" text-anchor="middle" class="state-label">Evidence updates</text>

  <!-- External capabilities and research-facing interfaces -->
