  <text x="816" y="1308" class="label">Tool calls &amp; observations</text>

  <text x="96" y="1442" class="role">Discovery &amp; retrieval</text>
  <text x="96" y="1477" class="small">OpenAlex snapshot · S2AG (planned)</text>
  <text x="96" y="1507" class="small">Metadata indexes · citation APIs</text>

  <text x="584" y="1442" class="role">Document &amp; analysis tools</text>
  <text x="584" y="1477" class="small">Web / library access · PDF / HTML</text>
  <text x="584" y="1507" class="small">Parsing · deduplication · calculations</text>

  <text x="1072" y="1442" class="role">Storage &amp; model services</text>
  <text x="1072" y="1477" class="small">LanceDB · documents · review log</text>
  <text x="1072" y="1507" class="small">Local / LAN / cloud model APIs</text>

  <text x="96" y="1547" class="small">Shared services for task execution, document access and persistent storage.</text>

  <rect x="1728" y="1272" width="608" height="304" rx="18" class="human"/>
  <path d="M2032 1212 V1266" class="state"/>
  <text x="2056" y="1247" class="state-label">Review &amp; inspect</text>
  <text x="1760" y="1310" class="human-eyebrow">RESEARCH INTERFACE</text>
  <text x="1760" y="1354" class="title">Evidence explorer</text>
  <text x="1760" y="1392" class="body">Literature evolution · PCA · source links</text>
  <text x="1760" y="1423" class="body">Human decisions · report review</text>
  <line x1="1760" y1="1447" x2="2304" y2="1447" stroke="#E0CEB8" stroke-width="1.2"/>
  <text x="1760" y="1482" class="role">Resource view &amp; deliverables</text>
  <text x="1760" y="1516" class="small">Queues · time · usage · available metrics</text>
  <text x="1760" y="1546" class="small">Reports · evidence tables · PRISMA flow</text>

  <text x="64" y="1624" font-size="20" fill="#5F716D">Scope amendments require approval · Claims retain source links · Completion follows review criteria</text>
</svg>
