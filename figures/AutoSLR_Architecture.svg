  <text x="92" y="620" class="body">Evidence &amp; dependencies</text>
  <text x="92" y="651" class="body">Completion criteria</text>
  <text x="92" y="682" class="body">Owner &amp; current status</text>

  <rect x="512" y="514" width="1008" height="196" rx="16" class="panel"/>
  <text x="544" y="551" class="eyebrow">DYNAMIC EXECUTION</text>
  <text x="544" y="596" class="title">Task Graph &amp; Scheduler</text>
  <text x="544" y="634" class="body">Dependencies · ownership · priority · concurrency</text>
  <text x="544" y="666" class="body">Assign ready tasks · record outcomes · recover interrupted work</text>
  <path d="M1016 432 V508" class="control"/>
  <text x="1040" y="478" class="label">Plan &amp; progress</text>
  <path d="M1526 612 H1722" class="state"/>
  <text x="1624" y="590" text-anchor="middle" class="state-label">Task state</text>

  <!-- Specialist capabilities; instances are allocated to research tasks -->
  <rect x="64" y="806" width="1456" height="442" rx="18" class="panel"/>
  <text x="96" y="846" class="eyebrow">SPECIALIST AGENT POOL</text>
  <text x="96" y="882" class="body">Concurrent task execution · agent instances created as needed</text>
  <path d="M1016 716 V800" class="control"/>
  <text x="1040" y="765" class="label">Tasks · proposals · results</text>

  <rect x="96" y="918" width="440" height="116" rx="11" class="agent"/>
  <text x="116" y="953" class="role">Search Agents</text>
  <text x="116" y="985" class="small">Database queries · citation expansion</text>
  <text x="116" y="1013" class="small">Candidate discovery</text>

  <rect x="560" y="918" width="440" height="116" rx="11" class="agent"/>
  <text x="580" y="953" class="role">Acquisition Agents</text>
